# Internal HA Load lab: 1-DC N=2 primary+replica. Image: jamoa-grid-sql:local
# Build: powershell -File examples/scripts/build-sql-image.ps1
# Start: docker compose --env-file env/mid.env up -d
# Matches living Load / HA gates (application-primary.yml + application-replica.yml)
name: grid-ha-1dc-n2

x-node-common: &node-common
  image: ${GRID_IMAGE:-jamoa-grid-sql:local}
  restart: unless-stopped

services:
  primary:
    <<: *node-common
    container_name: grid-ha-primary
    hostname: primary
    environment:
      SPRING_PROFILES_ACTIVE: primary
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:---enable-preview --add-modules=jdk.incubator.vector}
      GRID_LOAD_TIER: ${GRID_LOAD_TIER:-mid}
    volumes:
      - ./config:/app/config:ro
      - primary-data:/app/data
    command:
      - --spring.config.additional-location=file:/app/config/application-primary.yml
    ports:
      - "${SQL_PORT_PRIMARY:-15432}:15432"
      - "${HTTP_PORT_PRIMARY:-7777}:7777"
      - "${REPL_PORT_PRIMARY:-5615}:5615"
    networks: [ha-net]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7777/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 36
      start_period: 60s

  replica:
    <<: *node-common
    container_name: grid-ha-replica
    hostname: replica
    depends_on:
      primary:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: replica
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:---enable-preview --add-modules=jdk.incubator.vector}
      GRID_LOAD_TIER: ${GRID_LOAD_TIER:-mid}
    volumes:
      - ./config:/app/config:ro
      - replica-data:/app/data
    command:
      - --spring.config.additional-location=file:/app/config/application-replica.yml
    ports:
      - "${SQL_PORT_REPLICA:-15433}:15433"
      - "${HTTP_PORT_REPLICA:-7778}:7778"
      - "${REPL_PORT_REPLICA:-5616}:5616"
    networks: [ha-net]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7778/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 36
      start_period: 60s

networks:
  ha-net:
    name: grid-ha-1dc-n2-net
    driver: bridge

volumes:
  primary-data:
  replica-data: