# Product HA lab: 1-DC node n1 (grid-sql-server-starter)
grid:
  durability:
    enabled: true
    hydrate-mode: FULL
  sql:
    default-shards: 8
    data-dir: ./data/catalog
  sql-server:
    enabled: true
    host: 0.0.0.0
    port: 15432
    user: ""
    password: ""
  codec:
    duplex:
      enabled: true
      schema-epoch: 1
  overlay:
    enabled: false
    durable: false
  replication:
    ha:
      max-stale-lag: 10000
      replica-reads-enabled: true
    enabled: true
    node-id: n1
    cluster-id: grid-ha-1dc
    orchid:
      coupling: 15.0
      natural-freq-hz: 1.0
      order-threshold: 0.85
      tick-ms: 10
      digest-quorum: MAJORITY
      max-propose-in-flight: 64
    repair:
      homologous-enabled: true
      reconcile-interval-ms: 5000
    swarm:
      enabled: true
      score-window-ms: 5000
      migrate-threshold: 0.3
      apply-auto-cutover: true
    placement-optimizer:
      enabled: true
      dc-population-size: 8
      node-population-size: 12
      generations-per-tick: 3
      mutation-rate: 0.25
      diversity-weight: 0.15
      max-migrates-per-tick: 2
      voter-set-hints-enabled: true
      target-remote-voters: 1
      apply-voter-set-hints: true
    transport:
      bind-host: 0.0.0.0
      bind-port: 5615
      connect-timeout-ms: 5000
      peers:
        - { id: n2, host: n2, port: 5616, dc: dc-a }
        - { id: n3, host: n3, port: 5617, dc: dc-a }
    cross-dc:
      enabled: false
      local-dc: dc-a
      mode: ASYNC_SHIP
      learners: []
    op-log:
      segment-size: 64
      data-dir: ./data/replication
      fsync: true
    flow:
      max-inflight-ops: 10000
      domains: []

spring:
  threads:
    virtual:
      enabled: true
  main:
    banner-mode: "off"
  config:
    activate:
      on-profile: n1

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
      base-path: /
  endpoint:
    health:
      validate-group-membership: false
      show-details: always
      show-components: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState,gridLiveness
        readiness:
          include: readinessState,gridReadiness
  metrics:
    tags:
      application: grid-sql-server-n1

server:
  port: 7777
