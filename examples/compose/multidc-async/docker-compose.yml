  w1:
    <<: *node-common
    container_name: grid-ha-async-w1
    hostname: w1
    depends_on:
      a1:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: w1
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:---enable-preview --add-modules=jdk.incubator.vector}
      GRID_LOAD_TIER: ${GRID_LOAD_TIER:-mid}
    volumes:
      - ./config:/app/config:ro
      - w1-data:/app/data
    command:
      - --spring.config.additional-location=file:/app/config/application-w1.yml
    ports:
      - "7782:7782"
