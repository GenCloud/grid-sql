networks:
  dc-a:
    name: grid-ha-async-dc-a
    driver: bridge
  dc-b:
    name: grid-ha-async-dc-b
    driver: bridge
  dc-link:
    name: grid-ha-async-dc-link
    driver: bridge

volumes:
  a1-data:
  a2-data:
  a3-data:
  b1-data:
  b2-data:
