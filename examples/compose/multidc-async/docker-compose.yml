      - --spring.config.additional-location=file:/app/config/application-b2.yml
    ports:
      - "7781:7781"
      - "15436:15436"
      - "5619:5619"
    networks: [dc-b, dc-link]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7781/health/readiness"]
      interval: 5s
