# Product Multi-DC HA lab. Image: jamoa-grid-sql:local (grid-sql-server-starter)
# Build: powershell -File examples/scripts/build-sql-image.ps1
# Configs: ./config/application-{a1,a2,a3,b1,b2,w1}.yml (bind-mounted)
name: grid-ha-multidc-async

x-node-common: &node-common
  image: ${GRID_IMAGE:-jamoa-grid-sql:local}
  restart: unless-stopped

services:
  a1:
    <<: *node-common
    container_name: grid-ha-async-a1
    hostname: a1
    environment:
      SPRING_PROFILES_ACTIVE: a1
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:---enable-preview --add-modules=jdk.incubator.vector}
      GRID_LOAD_TIER: ${GRID_LOAD_TIER:-mid}
    volumes:
      - ./config:/app/config:ro
      - a1-data:/app/data
    command:
      - --spring.config.additional-location=file:/app/config/application-a1.yml
    ports:
      - "7777:7777"
      - "15432:15432"
      - "5615:5615"
    networks: [dc-a, dc-link]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7777/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 36
      start_period: 90s

  a2:
    <<: *node-common
    container_name: grid-ha-async-a2
    hostname: a2
    depends_on:
      a1:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: a2
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:---enable-preview --add-modules=jdk.incubator.vector}
      GRID_LOAD_TIER: ${GRID_LOAD_TIER:-mid}
    volumes:
      - ./config:/app/config:ro
      - a2-data:/app/data
    command:
      - --spring.config.additional-location=file:/app/config/application-a2.yml
    ports:
      - "7778:7778"
      - "15433:15433"
      - "5616:5616"
    networks: [dc-a, dc-link]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7778/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 36
      start_period: 90s

  a3:
    <<: *node-common
    container_name: grid-ha-async-a3
    hostname: a3
    depends_on:
      a1:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: a3
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:---enable-preview --add-modules=jdk.incubator.vector}
      GRID_LOAD_TIER: ${GRID_LOAD_TIER:-mid}
    volumes:
      - ./config:/app/config:ro
      - a3-data:/app/data
    command:
      - --spring.config.additional-location=file:/app/config/application-a3.yml
    ports:
      - "7779:7779"
      - "15434:15434"
      - "5617:5617"
    networks: [dc-a, dc-link]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7779/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 36
      start_period: 90s

  b1:
    <<: *node-common
    container_name: grid-ha-async-b1
    hostname: b1
    depends_on:
      a1:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: b1
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:---enable-preview --add-modules=jdk.incubator.vector}
      GRID_LOAD_TIER: ${GRID_LOAD_TIER:-mid}
    volumes:
      - ./config:/app/config:ro
      - b1-data:/app/data
    command:
      - --spring.config.additional-location=file:/app/config/application-b1.yml
    ports:
      - "7780:7780"
      - "15435:15435"
      - "5618:5618"
    networks: [dc-b, dc-link]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7780/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 36
      start_period: 90s

  b2:
    <<: *node-common
    container_name: grid-ha-async-b2
    hostname: b2
    depends_on:
      a1:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: b2
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:---enable-preview --add-modules=jdk.incubator.vector}
