# Product HA lab: Multi-DC node b1 (SYNC_VOTERS_ACROSS_DC)
grid:
  durability:
    enabled: true
    hydrate-mode: FULL
  sql:
    default-shards: 8
    data-dir: ./data/catalog
  sql-server:
    enabled: true
    host: 0.0.0.0
    port: 15435
    user: ""
    password: ""
  codec:
    duplex:
      enabled: true
      schema-epoch: 1
  overlay:
    enabled: false
    durable: false
  replication:
    ha:
      max-stale-lag: 0
    enabled: true
    node-id: b1
    cluster-id: grid-ha-multidc
    orchid:
      coupling: 15.0
      natural-freq-hz: 1.0
      order-threshold: 0.85
      tick-ms: 10
      digest-quorum: MAJORITY
      max-propose-in-flight: 64
    repair:
      homologous-enabled: true
      reconcile-interval-ms: 5000
    swarm:
      enabled: true
      score-window-ms: 5000
      migrate-threshold: 0.3
      apply-auto-cutover: true
    placement-optimizer:
      enabled: true
      dc-population-size: 8
      node-population-size: 12
      generations-per-tick: 3
      mutation-rate: 0.25
      diversity-weight: 0.15
      max-migrates-per-tick: 2
      voter-set-hints-enabled: true
      target-remote-voters: 1
      apply-voter-set-hints: true
    transport:
      bind-host: 0.0.0.0
      bind-port: 5618
      connect-timeout-ms: 5000
      peers:
        - { id: a1, host: a1, port: 5615, dc: dc-a }
        - { id: a2, host: a2, port: 5616, dc: dc-a }
        - { id: a3, host: a3, port: 5617, dc: dc-a }
        - { id: b2, host: b2, port: 5619, dc: dc-b }
        - { id: w1, host: w1, port: 5620, dc: witness }
    cross-dc:
      enabled: true
      local-dc: dc-b
      mode: SYNC_VOTERS_ACROSS_DC
      phase-coupling: false
      remote-ack-timeout-ms: 5000
      batch-max-ops: 64
      batch-max-wait-ms: 20
      require-remote-ack: false
      voters: [b1]
      learners: [b2]
      write-admission: false
    region:
      enabled: true
      role: HOLD
      epoch: 1
      claim-timeout-ms: 5000
      quorum-size: 2
    op-log:
      segment-size: 64
      data-dir: ./data/replication
      fsync: true
    flow:
      max-inflight-ops: 10000
      domains: []

spring:
  threads:
    virtual:
      enabled: true
  main:
    banner-mode: "off"
  config:
    activate:
      on-profile: b1

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
      base-path: /
  endpoint:
    health:
      validate-group-membership: false
      show-details: always
      show-components: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState,gridLiveness
        readiness:
          include: readinessState,gridReadiness
  metrics:
    tags:
      application: grid-sql-server-b1

server:
  port: 7780
