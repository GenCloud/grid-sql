grid:
  sql:
    default-shards: 8
    data-dir: ./data/catalog

spring:
  threads:
    virtual:
      enabled: true
  main:
    banner-mode: "off"

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,gridReadiness
  metrics:
    tags:
      application: grid-sql-server

logging:
  level:
    root: INFO
