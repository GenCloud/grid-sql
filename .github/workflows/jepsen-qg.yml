# Jepsen QG lab gate — separate from unit CI (never co-run with Load/JMH/OSS).
# Full matrix: see benchmarks/jepsen/COVERAGE.md (A–I).
# Triggers: workflow_dispatch, nightly, push main/master; PR only with label jepsen.
name: Jepsen QG

on:
  workflow_dispatch:
    inputs:
      time_limit:
        description: JEPSEN_TIME_LIMIT (seconds)
        required: false
        default: "60"
        type: string
  schedule:
    - cron: "0 3 * * *"
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: jepsen-qg-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  JEPSEN_TIME_LIMIT: ${{ github.event.inputs.time_limit || '60' }}
  JEPSEN_REBUILD: "0"
  MULTIDC_SKIP_REBUILD: "1"
  MULTIDC_FULL: "1"
  DOCKER_BUILDKIT: "1"
  MAVEN_OPTS: >-
    -Xmx2g
    -Dfile.encoding=UTF-8

jobs:
  build-image:
    name: Build Jepsen image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       contains(join(github.event.pull_request.labels.*.name, ','), 'jepsen'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Package client + Jepsen starter
        run: >
          mvn -B -ntp
          -pl grid-sql-client,grid-sql-jepsen-starter
          -am package
          -DskipTests

      - name: Build jamoa-grid-jepsen:local
        run: bash benchmarks/jepsen/scripts/build-jepsen-image.sh

      - name: Save image artifact
        run: |
          docker save jamoa-grid-jepsen:local | gzip -1 > jepsen-image.tar.gz
          ls -lh jepsen-image.tar.gz

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: jamoa-grid-jepsen-image
          path: jepsen-image.tar.gz
          retention-days: 3
          if-no-files-found: error

  matrix:
    name: Jepsen ${{ matrix.config }}
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        config:
          - 1dc-chaos
          - 1dc-unclean-revive
          - 1dc-nochao
          - multidc-async-chaos
          - multidc-sync-chaos
          - multidc-async-nochao
          - multidc-sync-nochao
          - witness-chaos
          - multidc-unclean-revive
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Download Jepsen image
        uses: actions/download-artifact@v4
        with:
          name: jamoa-grid-jepsen-image
          path: /tmp/jepsen-ci

      - name: Load image
        run: |
          gunzip -c /tmp/jepsen-ci/jepsen-image.tar.gz | docker load
          docker image inspect jamoa-grid-jepsen:local >/dev/null

      - name: Install grid-sql-client (control classpath)
        run: mvn -B -ntp -pl grid-sql-client -am install -DskipTests

      - name: Make scripts executable
        run: |
          chmod +x benchmarks/jepsen/scripts/*.sh \
            benchmarks/jepsen/multidc/scripts/*.sh \
            benchmarks/jepsen/witness/scripts/*.sh || true

      - name: Purge Jepsen volumes
        env:
          CONFIG: ${{ matrix.config }}
        run: |
          case "$CONFIG" in
            1dc-chaos|1dc-unclean-revive|1dc-nochao) SCOPE=1dc ;;
            multidc-*|witness-chaos) SCOPE=multidc ;;
            *) SCOPE=all ;;
          esac
          bash benchmarks/jepsen/scripts/jepsen-purge.sh "$SCOPE"

      - name: Run 1dc-chaos
        if: matrix.config == '1dc-chaos'
        env:
          JEPSEN_M2: /home/runner/.m2
        run: bash benchmarks/jepsen/scripts/run-jepsen.sh

      - name: Run 1dc-unclean-revive
        if: matrix.config == '1dc-unclean-revive'
        env:
          JEPSEN_M2: /home/runner/.m2
          JEPSEN_UNCLEAN_REVIVE: "1"
          JEPSEN_UNCLEAN_DOWN_SEC: "15"
        run: bash benchmarks/jepsen/scripts/run-jepsen-unclean-revive.sh

      - name: Run 1dc-nochao
        if: matrix.config == '1dc-nochao'
        env:
          JEPSEN_M2: /home/runner/.m2
        run: bash benchmarks/jepsen/scripts/run-jepsen-nochao.sh

      # Ref B p95 living floor = calm host. On GITHUB_ACTIONS qg-gate is CI_ADVISORY.
      - name: qg-gate (nochao latency)
        if: matrix.config == '1dc-nochao'
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACTS="benchmarks/jepsen/ARTIFACTS.txt"
          if [[ ! -f "$ARTIFACTS" ]]; then
            echo "ERROR: missing $ARTIFACTS after nochao run" >&2
            exit 1
          fi
          # shellcheck disable=SC1090
          source "$ARTIFACTS"
          if [[ -z "${REGISTER_HISTORY:-}" || -z "${APPEND_HISTORY:-}" ]]; then
            echo "ERROR: REGISTER_HISTORY/APPEND_HISTORY not set in ARTIFACTS.txt" >&2
            cat "$ARTIFACTS" >&2
            exit 1
          fi
          echo "qg-gate register=$REGISTER_HISTORY append=$APPEND_HISTORY"
          bash benchmarks/jepsen/scripts/qg-gate.sh \
            -RegisterHistory "$REGISTER_HISTORY" \
            -AppendHistory "$APPEND_HISTORY"

      - name: Run multidc-async-chaos
        if: matrix.config == 'multidc-async-chaos'
        env:
          JEPSEN_M2: /home/runner/.m2
          MULTIDC_FULL: "1"
          MULTIDC_SKIP_REBUILD: "1"
        run: bash benchmarks/jepsen/multidc/scripts/run-multidc-chaos.sh async

      - name: Run multidc-sync-chaos
        if: matrix.config == 'multidc-sync-chaos'
        env:
          JEPSEN_M2: /home/runner/.m2
          MULTIDC_FULL: "1"
          MULTIDC_SKIP_REBUILD: "1"
        run: bash benchmarks/jepsen/multidc/scripts/run-multidc-chaos.sh sync-voters

      - name: Run multidc-async-nochao
        if: matrix.config == 'multidc-async-nochao'
        env:
          JEPSEN_M2: /home/runner/.m2
          MULTIDC_FULL: "1"
          MULTIDC_SKIP_REBUILD: "1"
        run: bash benchmarks/jepsen/multidc/scripts/run-multidc-nochao.sh async

      - name: Run multidc-sync-nochao
        if: matrix.config == 'multidc-sync-nochao'
        env:
          JEPSEN_M2: /home/runner/.m2
          MULTIDC_FULL: "1"
          MULTIDC_SKIP_REBUILD: "1"
        run: bash benchmarks/jepsen/multidc/scripts/run-multidc-nochao.sh sync-voters

      - name: Run witness-chaos
        if: matrix.config == 'witness-chaos'
        env:
          JEPSEN_M2: /home/runner/.m2
          JEPSEN_TIME_LIMIT: ${{ env.JEPSEN_TIME_LIMIT }}
          MULTIDC_SKIP_REBUILD: "1"
        run: bash benchmarks/jepsen/witness/scripts/run-witness-chaos.sh

      - name: Run multidc-unclean-revive
        if: matrix.config == 'multidc-unclean-revive'
        env:
          JEPSEN_M2: /home/runner/.m2
          MULTIDC_FULL: "1"
          MULTIDC_SKIP_REBUILD: "1"
          JEPSEN_UNCLEAN_REVIVE: "1"
          JEPSEN_UNCLEAN_DOWN_SEC: "15"
        run: bash benchmarks/jepsen/multidc/scripts/run-multidc-unclean-revive.sh

      - name: Upload RESULTS + histories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jepsen-${{ matrix.config }}-artifacts
          path: |
            benchmarks/jepsen/COVERAGE.md
            benchmarks/jepsen/RESULTS.md
            benchmarks/jepsen/ARTIFACTS.txt
            benchmarks/jepsen/clojure/store/**/results.edn
            benchmarks/jepsen/clojure/store/**/history.edn
            benchmarks/jepsen/multidc/RESULTS.md
            benchmarks/jepsen/witness/RESULTS.md
          if-no-files-found: ignore
          retention-days: 14