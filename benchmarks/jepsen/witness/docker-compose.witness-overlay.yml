# UTF-8 no BOM
# Overlay: add Witness voter w1 beside Multi-DC Active + two Holds.
# Usage (from benchmarks/jepsen/multidc):
#   $env:MULTIDC_MODE='async'
#   docker compose -f docker-compose.yml -f ../witness/docker-compose.witness-overlay.yml up -d
#
# Requires image jamoa-grid-jepsen:local with /app/config/witness/ baked (see Dockerfile).
# Peer lists for a*/b* use witness/async/* (include w1); base multidc configs omit phantom w1.
#
# Health: management.endpoints.web.base-path=/ -> /health/liveness (not /replication/status).

services:
  a1:
    command:
      - --spring.config.additional-location=file:/app/config/witness/async/application-a1.yml
  a2:
    command:
      - --spring.config.additional-location=file:/app/config/witness/async/application-a2.yml
  a3:
    command:
      - --spring.config.additional-location=file:/app/config/witness/async/application-a3.yml
  b1:
    command:
      - --spring.config.additional-location=file:/app/config/witness/async/application-b1.yml
  b2:
    command:
      - --spring.config.additional-location=file:/app/config/witness/async/application-b2.yml
  w1:
    image: jamoa-grid-jepsen:local
    container_name: jamoa-multidc-w1
    hostname: w1
    environment:
      SPRING_PROFILES_ACTIVE: jepsen,w1
      JAVA_TOOL_OPTIONS: "--enable-preview --add-modules=jdk.incubator.vector"
      LOGGING_LEVEL_ORG_GENFORK_GRID: DEBUG
      LOGGING_LEVEL_ORG_GENFORK_GRID_DIAG: DEBUG
    volumes:
      - w1-data:/app/data
    command:
      - --spring.config.additional-location=file:/app/config/witness/application-w1.yml
    ports:
      - "7782:7782"
      - "15437:15437"
      - "5620:5620"
    networks:
      - dc-link
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7782/health/liveness"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 90s

volumes:
  w1-data:
